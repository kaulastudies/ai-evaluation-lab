name: ProofGate GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hackathon/nebius-nvidia-rarb-demo/**'
      - 'programs/repository-agent-reliability/**'
      - '.github/workflows/proofgate-pages.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'hackathon/nebius-nvidia-rarb-demo/**'
      - 'programs/repository-agent-reliability/**'
      - '.github/workflows/proofgate-pages.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build from public source and verify pinned runtime
        run: python hackathon/nebius-nvidia-rarb-demo/build_pages.py --output "$RUNNER_TEMP/proofgate-pages"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/proofgate-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
