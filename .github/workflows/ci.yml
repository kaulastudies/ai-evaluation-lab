name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python ops/gates/validate_as001.py
      - run: python ops/gates/validate_as001_live_evidence.py
      - run: python ops/gates/validate_as001_groq_evidence.py
      - run: python ops/gates/validate_as002.py
      - name: RARB Python compilation
        run: python -m compileall -q programs/repository-agent-reliability
      - name: RARB diff hygiene
        run: git diff --check 257cb7a3510a05e124e279a32357befa51b2f7f4 HEAD
      - name: RARB Phase 12 evidence integrity
        run: PYTHONPATH=src python programs/repository-agent-reliability/runner/phase12_evidence_check.py
      - name: RARB deterministic evidence gate
        run: PYTHONPATH=src python programs/repository-agent-reliability/demo/run_demo_check.py
      - run: PYTHONPATH=src python -m eval_lab.alpha_demo --output runs/ci
