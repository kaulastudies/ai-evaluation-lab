name: ProofGate PR demo

on:
  pull_request:
    paths:
      - 'examples/proofgate-pr-demo/**'
      - 'integrations/proofgate-action/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  proofgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./integrations/proofgate-action
        with:
          contract: examples/proofgate-pr-demo/.proofgate/contract.json
