name: ReceiptOps containment
on:
  push:
    branches: [hackathon/receiptops-agent-rush]
    paths:
      - 'hackathon/vultr-receiptops/**'
      - '.github/workflows/receiptops.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hackathon/vultr-receiptops
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: hackathon/vultr-receiptops
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Core verification
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pull and pin execution image
        run: |
          docker pull python:3.12-slim
          echo "SANDBOX_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Real Docker containment checks
        run: python -m unittest discover -s tests -p 'integration_sandbox.py' -v
