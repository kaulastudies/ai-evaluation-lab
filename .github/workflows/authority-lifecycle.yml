name: Authority lifecycle review

on:
  pull_request:
    paths:
      - 'examples/authority-lifecycle/**'
      - '.github/workflows/authority-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original cases, broken controls, concurrency and rollback
        run: python examples/authority-lifecycle/run_review.py "${{ runner.temp }}/authority-evidence"
      - name: Browser engine contract and source binding
        run: |
          python -m unittest discover -s examples/authority-lifecycle -p test_web_demo.py -v
          python examples/authority-lifecycle/verify_sources.py
      - name: Retain receiver databases and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: authority-lifecycle-evidence
          path: ${{ runner.temp }}/authority-evidence
          retention-days: 14
          if-no-files-found: error
