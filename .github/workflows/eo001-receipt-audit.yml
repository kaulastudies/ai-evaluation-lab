name: EO-001 independent receipt audit

on:
  pull_request:
    paths:
      - 'research/eo001_receipt_audit/**'
      - 'tests/test_receipt_audit.py'
      - '.github/workflows/eo001-receipt-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/eo001_receipt_audit/**'
      - 'tests/test_receipt_audit.py'
      - '.github/workflows/eo001-receipt-audit.yml'

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Offline independent checks
        run: |
          python -m unittest discover -s tests -p test_receipt_audit.py -v
          python research/eo001_receipt_audit/audit.py --check
      - name: Fetch pinned public inputs without vendoring source
        run: python research/eo001_receipt_audit/fetch_sources.py "$RUNNER_TEMP/eo001-pinned"
      - name: Execute exact upstream and check PR 29 intake compatibility
        run: >-
          python research/eo001_receipt_audit/audit.py --check
          --source-file "$RUNNER_TEMP/eo001-pinned/ambiguous-external-effect.mjs"
          --inspect-adapter "$RUNNER_TEMP/eo001-pinned/adoption.py"
      - name: Install isolated signing dependency
        run: python -m pip install -r research/eo001_receipt_audit/durable/requirements.txt
      - name: Signed evidence and workflow boundary tests
        run: python -m unittest discover -s research/eo001_receipt_audit/durable/tests -v
      - name: Replay recorded process evidence
        run: python -m research.eo001_receipt_audit.durable.suite --check
      - name: Fresh process kills, concurrent retries and workflow controls
        run: python -m research.eo001_receipt_audit.durable.suite --run --output "$RUNNER_TEMP/eo-durable-evidence.json"
      - name: Replay independent Systemia mapping and negative controls
        run: |
          python -m research.eo001_receipt_audit.systemia.evaluate --check
          python -m unittest discover -s research/eo001_receipt_audit/systemia/tests -v
      - name: Fetch reviewed Evercraft source closure by commit and hash
        run: python -m research.eo001_receipt_audit.systemia.fetch_sources "$RUNNER_TEMP/eo-systemia-pinned"
      - name: Independently run Evercraft candidate and native recovery CLI
        run: >-
          python -m research.eo001_receipt_audit.systemia.evaluate --run
          --forge-source "$RUNNER_TEMP/eo-systemia-pinned"
          --output "$RUNNER_TEMP/eo-systemia-evidence.json"
      - name: Preserve public evidence from this CI run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eo-durable-public-evidence
          path: |
            ${{ runner.temp }}/eo-durable-evidence.json
            ${{ runner.temp }}/eo-systemia-evidence.json
          retention-days: 7
          if-no-files-found: error
