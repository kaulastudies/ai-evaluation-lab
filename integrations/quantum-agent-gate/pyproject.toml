[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-agent-gate"
version = "0.1.0"
description = "Experimental Qiskit V2 local-execution policy guard for quantum coding agents"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
qiskit = ["qiskit>=2.0,<3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
